<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definitely Not Suspicious</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    text-align:center;
    max-width:700px;
    padding:20px;
}

h1{
    color:#00ff99;
}

button{
    margin-top:20px;
    padding:12px 30px;
    background:#111;
    color:#fff;
    border:1px solid #00ff99;
    cursor:pointer;
    transition:.3s;
    font-size:16px;
}

button:hover{
    background:#00ff99;
    color:#000;
}

#text{
    margin-top:30px;
    min-height:80px;
    font-size:20px;
    line-height:1.6;
}

video{
    display:none;
    width:90%;
    max-width:450px;
    margin-top:20px;
    border-radius:10px;
    border:2px solid #00ff99;
    box-shadow:0 0 20px #00ff99;
}
</style>
</head>

<body>

<div class="box">

<h1>MEOW.exe</h1>

<p>⚠ Warning: Clicking the button may cause absolutely nothing.</p>

<button onclick="nextStep()">DO NOT CLICK</button>

<div id="text"></div>

<video id="catVideo" autoplay playsinline controls></video>

</div>

<script>

// Messages
const messages = [
"Seriously?",
"I literally said don't.",
"You're the type who presses elevator buttons twice, aren't you?",
"Still clicking...",
"Okay... now I'm judging you.",
"Fine. Since you're committed...",
"You officially have the curiosity level of KHUSHI VERMA.",
"Emergency Cat Protocol Activated 🐈",

"HELLO 😺",
"Please, Let me Sleep 😸",
"Bruh, Seriously can't you see I'm having my meal rn😹",
"Listen to Me carefully and then LEAVE!!! 😻",
"Okay, So you're not leaving Right!!! 😼",
"Then let Me Sing For you 🐱",
"That's enough now, It's time to kill you 😺",
"Okay sorry, I was jk. 😽",
"One Last Performance for you 😹",
"Okay GOODBYE, see you again... 🥹",

"It's OVER :(",
"Hope you wasted your time preciously!! 😊",
"Mission Complete ✔"
];

const catVideos = [
"cats/cat1.mp4",
"cats/cat2.mp4",
"cats/cat3.mp4",
"cats/cat4.mp4",
"cats/cat5.mp4",
"cats/cat6.mp4",
"cats/cat7.mp4",
"cats/cat8.mp4",
"cats/cat9.mp4",
"cats/cat10.mp4"
];

let step = 0;

function playVideo(index){
    const video = document.getElementById("catVideo");

    video.style.display = "block";
    video.src = catVideos[index];
    video.load();
    video.muted = false;

    video.play().catch(err=>{
        console.log(err);
    });
}

function nextStep(){

    document.getElementById("text").innerHTML = messages[step];

    if(step >= 8 && step <= 17){
        playVideo(step - 8);
    }

    if(step == 18){
        const video = document.getElementById("catVideo");
        video.pause();
        video.currentTime =0;
        video.style.display ="none"
    }

    if(step == 20){
        document.querySelector("button").innerHTML = "WATCH AGAIN 🔄";
    }

    if(step > 20){
        step = 0;
        document.getElementById("text").innerHTML = "";
        const video = document.getElementById("catVideo");
        video.pause();
        video.currentTime = 0;
        video.style.display = "none";
        document.querySelector("button").innerHTML = "DO NOT CLICK";
        return;
    }

    step++;
}

</script>

</body>
</html>
